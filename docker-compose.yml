version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sourcepilot-postgres
    environment:
      POSTGRES_USER: sourcepilot
      POSTGRES_PASSWORD: sourcepilot
      POSTGRES_DB: sourcepilot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcepilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sourcepilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
